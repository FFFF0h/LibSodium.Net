name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-windows-x64:
    runs-on: windows-latest
    steps:
    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Display .NET Info
      run: dotnet --info

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Display current directory
      run: pwd

    - name: Restore dependencies LibSodium.Net
      run: dotnet restore .\src\LibSodium.Net\LibSodium.Net.csproj

    - name: Build LibSodium.Net
      run: dotnet build .\src\LibSodium.Net\LibSodium.Net.csproj --configuration Release --no-restore

    - name: Publish LibSodium.Net.Tests AOT
      run: dotnet publish .\src\LibSodium.Net.Tests\LibSodium.Net.Tests.Win.csproj --configuration Release -warnaserror
      
    - name: Execute LibSodium.Net.Tests AOT
      run: .\src\LibSodium.Net.Tests\bin\Release\net10.0\win-x64\publish\LibSodium.Net.Tests.Win.exe

  test-mac:
    runs-on: macos-15
    steps:
    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Display .NET Info
      run: dotnet --info

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Verify Apple Silicon runner
      run: test "$(uname -m)" = "arm64"

    - name: Restore dependencies LibSodium.Net
      run: dotnet restore ./src/LibSodium.Net/LibSodium.Net.csproj

    - name: Build LibSodium.Net
      run: dotnet build ./src/LibSodium.Net/LibSodium.Net.csproj --configuration Release --no-restore

    - name: Publish LibSodium.Net.Tests AOT (macOS)
      run: dotnet publish ./src/LibSodium.Net.Tests/LibSodium.Net.Tests.Mac.csproj --configuration Release -warnaserror

    - name: List published files (macOS)
      run: ls -l ./src/LibSodium.Net.Tests/bin/Release/net10.0/osx-arm64/publish

    - name: Execute LibSodium.Net.Tests AOT (macOS)
      run: ./src/LibSodium.Net.Tests/bin/Release/net10.0/osx-arm64/publish/LibSodium.Net.Tests.Mac

  test-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Display .NET Info
      run: dotnet --info

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Restore dependencies LibSodium.Net
      run: dotnet restore ./src/LibSodium.Net/LibSodium.Net.csproj

    - name: Build LibSodium.Net
      run: dotnet build ./src/LibSodium.Net/LibSodium.Net.csproj --configuration Release --no-restore

    - name: Publish LibSodium.Net.Tests AOT (Linux)
      run: dotnet publish ./src/LibSodium.Net.Tests/LibSodium.Net.Tests.Linux.csproj --configuration Release -warnaserror

    - name: List published files (Linux)
      run: ls -l ./src/LibSodium.Net.Tests/bin/Release/net10.0/linux-x64/publish

    - name: Execute LibSodium.Net.Tests AOT (Linux)
      run: ./src/LibSodium.Net.Tests/bin/Release/net10.0/linux-x64/publish/LibSodium.Net.Tests.Linux

  test-ios-aot:
    runs-on: macos-26
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Select Xcode 26.6
      run: sudo xcode-select --switch /Applications/Xcode_26.6.app

    - name: Verify Xcode command-line tools
      run: |
        test "$(uname -m)" = "arm64"
        xcodebuild -version
        xcrun --version
        xcrun --find clang

    - name: Publish iOS Simulator ARM64 Native AOT
      run: dotnet publish ./src/LibSodium.Net.Tests/LibSodium.Net.Tests.iOS.csproj --configuration Release --runtime iossimulator-arm64 -warnaserror

    - name: Verify iOS Simulator ARM64 native executable
      run: test -f ./src/LibSodium.Net.Tests/bin/Release/net10.0-ios/iossimulator-arm64/publish/LibSodium.Net.Tests.iOS

  test-android-aot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Install Android workload
      run: dotnet workload install android

    - name: Publish Android TUnit host with workload AOT
      run: dotnet publish ./src/LibSodium.Net.Tests/LibSodium.Net.Tests.Android.csproj --configuration Release -p:RunAOTCompilation=true -warnaserror

    - name: Verify Android package
      run: test -n "$(find ./src/LibSodium.Net.Tests/bin/Release/net10.0-android/android-x64 -name '*.apk' -print -quit)"


